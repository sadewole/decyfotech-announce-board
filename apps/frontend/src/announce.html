<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Relay — Announcement Board</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --background: #0b0d12;
        --surface: #12151c;
        --surface-hover: #171b24;
        --border: #232833;
        --foreground: #e7e9ee;
        --muted: #8a93a3;
        --accent: #e8a33d;
        --accent-fg: #1a1305;
        --live: #5fd9a4;
        --urgent: #ff5d5d;
        --event: #7da8ff;
        --radius: 14px;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        background: var(--background);
        color: var(--foreground);
        font-family: 'Inter', sans-serif;
        min-height: 100vh;
        -webkit-font-smoothing: antialiased;
      }
      h1,
      h2,
      h3,
      .display {
        font-family: 'Space Grotesk', sans-serif;
      }
      .mono {
        font-family: 'JetBrains Mono', monospace;
      }
      a {
        color: inherit;
      }
      button {
        font-family: inherit;
        cursor: pointer;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      /* ---------- background ambience ---------- */
      .bg-grid {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        background-image:
          radial-gradient(ellipse 800px 500px at 15% -10%, rgba(232, 163, 61, 0.08), transparent),
          radial-gradient(ellipse 600px 400px at 100% 20%, rgba(125, 168, 255, 0.05), transparent);
      }

      /* ---------- LOGIN ---------- */
      #loginScreen {
        position: relative;
        z-index: 1;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .login-card {
        width: 100%;
        max-width: 380px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 36px 32px;
        position: relative;
        overflow: hidden;
      }
      .login-wave {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 64px;
        opacity: 0.5;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 28px;
      }
      .brand-mark {
        width: 30px;
        height: 30px;
        border-radius: 8px;
        background: var(--accent);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--accent-fg);
        font-weight: 700;
        font-size: 15px;
      }
      .brand-name {
        font-size: 19px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      .login-card h1 {
        font-size: 22px;
        font-weight: 600;
        margin: 0 0 6px;
        letter-spacing: -0.01em;
      }
      .login-sub {
        color: var(--muted);
        font-size: 13.5px;
        margin: 0 0 26px;
        line-height: 1.5;
      }
      .field {
        margin-bottom: 16px;
      }
      .field label {
        display: block;
        font-size: 12.5px;
        color: var(--muted);
        margin-bottom: 6px;
        font-weight: 500;
      }
      .field input {
        width: 100%;
        background: #0e1016;
        border: 1px solid var(--border);
        border-radius: 9px;
        padding: 10px 12px;
        color: var(--foreground);
        font-size: 14px;
        transition: border-color 0.15s;
      }
      .field input:focus {
        border-color: var(--accent);
        outline: none;
      }
      .btn-primary {
        width: 100%;
        background: var(--accent);
        color: var(--accent-fg);
        border: none;
        border-radius: 9px;
        padding: 11px;
        font-size: 14px;
        font-weight: 600;
        margin-top: 6px;
        transition:
          box-shadow 0.2s,
          transform 0.15s;
      }
      .btn-primary:hover {
        box-shadow: 0 0 0 4px rgba(232, 163, 61, 0.18);
      }
      .btn-primary:active {
        transform: scale(0.98);
      }
      .login-foot {
        margin-top: 20px;
        text-align: center;
        font-size: 13px;
        color: var(--muted);
      }
      .login-foot span {
        color: var(--accent);
        cursor: pointer;
        font-weight: 500;
      }

      /* ---------- BOARD ---------- */
      #boardScreen {
        position: relative;
        z-index: 1;
        display: none;
        min-height: 100vh;
        flex-direction: column;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 18px 32px;
        border-bottom: 1px solid var(--border);
        position: sticky;
        top: 0;
        background: rgba(11, 13, 18, 0.85);
        backdrop-filter: blur(10px);
        z-index: 10;
      }
      .status {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
        font-size: 12.5px;
        margin-left: 16px;
        padding-left: 16px;
        border-left: 1px solid var(--border);
      }
      .pulse-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--live);
        box-shadow: 0 0 0 0 rgba(95, 217, 164, 0.5);
        animation: pulse 2.2s infinite;
      }
      @keyframes pulse {
        0% {
          box-shadow: 0 0 0 0 rgba(95, 217, 164, 0.45);
        }
        70% {
          box-shadow: 0 0 0 7px rgba(95, 217, 164, 0);
        }
        100% {
          box-shadow: 0 0 0 0 rgba(95, 217, 164, 0);
        }
      }
      .header-left {
        display: flex;
        align-items: center;
      }
      .header-right {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .avatar {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: #1d2330;
        border: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 13px;
        font-weight: 600;
        color: var(--foreground);
      }
      .btn-new {
        display: flex;
        align-items: center;
        gap: 7px;
        background: var(--accent);
        color: var(--accent-fg);
        border: none;
        border-radius: 8px;
        padding: 9px 16px;
        font-size: 13.5px;
        font-weight: 600;
        transition: box-shadow 0.2s;
      }
      .btn-new:hover {
        box-shadow: 0 0 0 4px rgba(232, 163, 61, 0.18);
      }

      main {
        flex: 1;
        padding: 40px 32px 80px;
        display: flex;
        justify-content: center;
      }
      .feed-wrap {
        width: 100%;
        max-width: 680px;
        position: relative;
      }
      .feed-title {
        font-size: 14px;
        color: var(--muted);
        margin-bottom: 22px;
        display: flex;
        justify-content: space-between;
        align-items: baseline;
      }
      .feed-title .count {
        font-family: 'JetBrains Mono', monospace;
        font-size: 12px;
      }

      .rail {
        position: absolute;
        left: 0;
        top: 6px;
        bottom: 0;
        width: 1px;
        background: var(--border);
      }
      #feed {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .post {
        position: relative;
        margin-left: 26px;
        padding: 18px 20px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        margin-bottom: 16px;
        transition:
          transform 0.15s,
          border-color 0.15s,
          background 0.15s;
        animation: enter 0.35s ease both;
      }
      @keyframes enter {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .post:hover {
        transform: translateY(-2px);
        border-color: #2c3240;
        background: var(--surface-hover);
      }
      .tick {
        position: absolute;
        left: -26px;
        top: 24px;
        width: 11px;
        height: 1px;
        background: var(--border);
      }
      .tick-dot {
        position: absolute;
        left: -30px;
        top: 19px;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        border: 2px solid var(--background);
      }
      .post-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 10px;
      }
      .post-meta {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .tag {
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px;
        font-weight: 500;
        padding: 2px 8px;
        border-radius: 5px;
        display: flex;
        align-items: center;
        gap: 5px;
        letter-spacing: 0.02em;
      }
      .tag-dot {
        width: 5px;
        height: 5px;
        border-radius: 50%;
      }
      .tag.general {
        background: rgba(138, 147, 163, 0.12);
        color: var(--muted);
      }
      .tag.general .tag-dot {
        background: var(--muted);
      }
      .tag.urgent {
        background: rgba(255, 93, 93, 0.12);
        color: var(--urgent);
      }
      .tag.urgent .tag-dot {
        background: var(--urgent);
      }
      .tag.event {
        background: rgba(125, 168, 255, 0.12);
        color: var(--event);
      }
      .tag.event .tag-dot {
        background: var(--event);
      }
      .timestamp {
        font-family: 'JetBrains Mono', monospace;
        font-size: 11.5px;
        color: var(--muted);
      }
      .post h3 {
        font-size: 15.5px;
        font-weight: 600;
        margin: 0 0 6px;
        letter-spacing: -0.005em;
      }
      .post p {
        font-size: 13.8px;
        line-height: 1.55;
        color: #b7bec9;
        margin: 0 0 12px;
      }
      .post-foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .author {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12.5px;
        color: var(--muted);
      }
      .author .avatar {
        width: 20px;
        height: 20px;
        font-size: 10px;
      }
      .btn-delete {
        background: none;
        border: none;
        color: var(--muted);
        opacity: 0;
        transition:
          opacity 0.15s,
          color 0.15s;
        display: flex;
        align-items: center;
        gap: 5px;
        font-size: 12px;
        padding: 4px 6px;
        border-radius: 6px;
      }
      .post:hover .btn-delete {
        opacity: 1;
      }
      .btn-delete:hover {
        color: var(--urgent);
        background: rgba(255, 93, 93, 0.08);
      }

      .empty {
        text-align: center;
        padding: 70px 20px;
        color: var(--muted);
      }
      .empty-icon {
        width: 44px;
        height: 44px;
        margin: 0 auto 16px;
        border-radius: 10px;
        background: var(--surface);
        border: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .empty h3 {
        color: var(--foreground);
        font-size: 16px;
        margin: 0 0 6px;
      }
      .empty p {
        font-size: 13.5px;
        margin: 0 0 20px;
      }

      /* ---------- MODAL ---------- */
      .overlay {
        position: fixed;
        inset: 0;
        background: rgba(6, 7, 10, 0.6);
        backdrop-filter: blur(3px);
        display: none;
        align-items: flex-start;
        justify-content: center;
        padding-top: 10vh;
        z-index: 100;
      }
      .modal {
        width: 100%;
        max-width: 440px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 26px;
        animation: enter 0.2s ease both;
      }
      .modal h2 {
        font-size: 17px;
        margin: 0 0 18px;
        font-weight: 600;
      }
      .field textarea {
        width: 100%;
        background: #0e1016;
        border: 1px solid var(--border);
        border-radius: 9px;
        padding: 10px 12px;
        color: var(--foreground);
        font-size: 14px;
        font-family: inherit;
        resize: vertical;
        min-height: 80px;
      }
      .field textarea:focus {
        border-color: var(--accent);
        outline: none;
      }
      .cat-options {
        display: flex;
        gap: 8px;
      }
      .cat-btn {
        flex: 1;
        padding: 8px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: #0e1016;
        color: var(--muted);
        font-size: 12.5px;
        font-family: 'JetBrains Mono', monospace;
        transition: all 0.15s;
      }
      .cat-btn.active {
        border-color: var(--accent);
        color: var(--accent);
        background: rgba(232, 163, 61, 0.08);
      }
      .modal-actions {
        display: flex;
        gap: 10px;
        margin-top: 22px;
      }
      .btn-ghost {
        flex: 1;
        background: none;
        border: 1px solid var(--border);
        color: var(--foreground);
        border-radius: 9px;
        padding: 10px;
        font-size: 13.5px;
        font-weight: 500;
      }
      .btn-ghost:hover {
        background: var(--surface-hover);
      }
      .modal-actions .btn-primary {
        flex: 1;
        margin-top: 0;
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
        }
      }
      @media (max-width: 640px) {
        header {
          padding: 14px 16px;
        }
        main {
          padding: 24px 16px 60px;
        }
        .status {
          display: none;
        }
        .post {
          margin-left: 18px;
        }
        .tick,
        .tick-dot {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="bg-grid"></div>

    <!-- LOGIN -->
    <div id="loginScreen">
      <div class="login-card">
        <svg class="login-wave" viewBox="0 0 380 64" preserveAspectRatio="none">
          <path
            d="M0,32 Q20,10 40,32 T80,32 T120,32 T160,32 T200,32 T240,32 T280,32 T320,32 T360,32"
            fill="none"
            stroke="#E8A33D"
            stroke-width="1"
            opacity="0.35"
          />
        </svg>
        <div class="brand">
          <div class="brand-mark">R</div>
          <div class="brand-name">Relay</div>
        </div>
        <h1>Sign in</h1>
        <p class="login-sub">Catch every announcement the moment it's transmitted.</p>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" placeholder="you@company.com" value="jordan@company.com" />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" type="password" placeholder="••••••••" value="password" />
        </div>
        <button class="btn-primary" onclick="enterBoard()">Sign in</button>
        <div class="login-foot">No account? <span>Request access</span></div>
      </div>
    </div>

    <!-- BOARD -->
    <div id="boardScreen">
      <header>
        <div class="header-left">
          <div class="brand">
            <div class="brand-mark">R</div>
            <div class="brand-name">Relay</div>
          </div>
          <div class="status"><span class="pulse-dot"></span> All systems live</div>
        </div>
        <div class="header-right">
          <button class="btn-new" onclick="openModal()">
            <svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
            >
              <path d="M12 5v14M5 12h14" />
            </svg>
            New announcement
          </button>
          <div class="avatar">J</div>
        </div>
      </header>

      <main>
        <div class="feed-wrap">
          <div class="feed-title">
            <span>Transmission log</span>
            <span class="count" id="postCount">3 posts</span>
          </div>
          <div class="rail"></div>
          <ul id="feed"></ul>
        </div>
      </main>
    </div>

    <!-- MODAL -->
    <div class="overlay" id="overlay">
      <div class="modal">
        <h2>New announcement</h2>
        <div class="field">
          <label>Title</label>
          <input id="postTitle" type="text" placeholder="What's the headline?" />
        </div>
        <div class="field">
          <label>Message</label>
          <textarea id="postBody" placeholder="Share the details..."></textarea>
        </div>
        <div class="field">
          <label>Category</label>
          <div class="cat-options">
            <button class="cat-btn active" data-cat="general" onclick="selectCat(this)">
              GENERAL
            </button>
            <button class="cat-btn" data-cat="event" onclick="selectCat(this)">EVENT</button>
            <button class="cat-btn" data-cat="urgent" onclick="selectCat(this)">URGENT</button>
          </div>
        </div>
        <div class="modal-actions">
          <button class="btn-ghost" onclick="closeModal()">Cancel</button>
          <button class="btn-primary" onclick="submitPost()">Post</button>
        </div>
      </div>
    </div>

    <script>
      let posts = [
        {
          id: 3,
          title: 'Office closed Monday',
          body: 'Building maintenance means the office will be closed all day Monday. Everyone works from home.',
          cat: 'urgent',
          time: 'Jul 29, 09:14',
          author: 'A',
        },
        {
          id: 2,
          title: 'Town hall this Friday',
          body: "Q3 roadmap review, 3pm in the main hall. Bring questions — we're opening the floor at the end.",
          cat: 'event',
          time: 'Jul 28, 16:02',
          author: 'M',
        },
        {
          id: 1,
          title: 'New coffee machine installed',
          body: 'The espresso machine on the 4th floor is finally fixed. Beans have also been restocked.',
          cat: 'general',
          time: 'Jul 27, 11:30',
          author: 'J',
        },
      ];
      let nextId = 4;
      let selectedCat = 'general';

      function enterBoard() {
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('boardScreen').style.display = 'flex';
        render();
      }

      function render() {
        const feed = document.getElementById('feed');
        document.getElementById('postCount').textContent =
          posts.length + (posts.length === 1 ? ' post' : ' posts');
        if (posts.length === 0) {
          feed.innerHTML = `<div class="empty">
      <div class="empty-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8A93A3" stroke-width="1.8"><path d="M4 4h16v12H8l-4 4V4z"/></svg>
      </div>
      <h3>Nothing transmitted yet</h3>
      <p>Post the first announcement to get things on the record.</p>
      <button class="btn-primary" style="width:auto;padding:9px 18px;" onclick="openModal()">New announcement</button>
    </div>`;
          return;
        }
        feed.innerHTML = posts
          .map(
            (p) => `
    <li class="post">
      <div class="tick"></div>
      <div class="tick-dot" style="background:${catColor(p.cat)}"></div>
      <div class="post-top">
        <div class="post-meta">
          <span class="tag ${p.cat}"><span class="tag-dot"></span>${p.cat.toUpperCase()}</span>
        </div>
        <span class="timestamp">${p.time}</span>
      </div>
      <h3>${escapeHtml(p.title)}</h3>
      <p>${escapeHtml(p.body)}</p>
      <div class="post-foot">
        <div class="author"><div class="avatar">${p.author}</div> Posted by team</div>
        <button class="btn-delete" onclick="deletePost(${p.id})">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>
          Delete
        </button>
      </div>
    </li>
  `,
          )
          .join('');
      }

      function catColor(cat) {
        return cat === 'urgent' ? '#FF5D5D' : cat === 'event' ? '#7DA8FF' : '#8A93A3';
      }
      function escapeHtml(s) {
        return s.replace(
          /[&<>"']/g,
          (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c],
        );
      }

      function openModal() {
        document.getElementById('overlay').style.display = 'flex';
        document.getElementById('postTitle').focus();
      }
      function closeModal() {
        document.getElementById('overlay').style.display = 'none';
        document.getElementById('postTitle').value = '';
        document.getElementById('postBody').value = '';
        selectedCat = 'general';
        document.querySelectorAll('.cat-btn').forEach((b) => b.classList.remove('active'));
        document.querySelector('.cat-btn[data-cat="general"]').classList.add('active');
      }
      function selectCat(btn) {
        document.querySelectorAll('.cat-btn').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        selectedCat = btn.dataset.cat;
      }
      function submitPost() {
        const title = document.getElementById('postTitle').value.trim();
        const body = document.getElementById('postBody').value.trim();
        if (!title) {
          document.getElementById('postTitle').focus();
          return;
        }
        posts.unshift({
          id: nextId++,
          title,
          body: body || 'No additional details.',
          cat: selectedCat,
          time: 'Just now',
          author: 'J',
        });
        closeModal();
        render();
      }
      function deletePost(id) {
        posts = posts.filter((p) => p.id !== id);
        render();
      }
      document.getElementById('overlay').addEventListener('click', (e) => {
        if (e.target.id === 'overlay') closeModal();
      });
    </script>
  </body>
</html>
